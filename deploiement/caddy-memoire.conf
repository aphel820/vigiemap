# Mémoire de Caddy : jamais sur le disque. Caddy voit passer les adresses IP et les en-têtes (code medic) ;
# sans ce réglage, une partie de sa mémoire pourrait finir dans le swap, ou dans une image mémoire après
# un plantage. À copier dans /etc/systemd/system/caddy.service.d/vigie.conf, puis :
#   sudo systemctl daemon-reload && sudo systemctl restart caddy

[Service]
MemorySwapMax=0
LimitCORE=0
# Caddy tué (mémoire pleine) ou planté : il revient tout seul en 3 s, au lieu de laisser le site coupé
# jusqu'à ce que quelqu'un s'en aperçoive
Restart=always
RestartSec=3
